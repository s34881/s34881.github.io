<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Siranata's Portfolio ✨</title>

    <!-- Google Fonts for Thai (Luxury Script & Modern Elegance) & English Decorative -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Charmonman:wght@400;700&family=Great+Vibes&family=Krub:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Smooth Scrolling */
        html {
            scroll-behavior: smooth;
        }

        /* Custom English Font Definition with Fallbacks (คงเดิมไว้ตามที่ขอ) */
        .en-font {
            font-family: 'Rosita', 'ITC Blackadder', 'Aston Script', 'Beautiful Friends', 'Great Vibes', 'Alex Brush', cursive, sans-serif !important;
            letter-spacing: 1.5px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Krub', sans-serif;
            /* Luxury Rose Gold Gradient Background */
            background: linear-gradient(135deg, #2b1118 0%, #4a1d28 35%, #682637 70%, #2b1118 100%);
            background-attachment: fixed;
            color: #f7e7ce;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Luxurious Shimmer Background Overlay */
        .luxury-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background: 
                radial-gradient(circle at 20% 20%, rgba(212, 175, 55, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(230, 168, 179, 0.15) 0%, transparent 40%);
        }

        /* Main Card Container with Luxury Metallic Borders & Shadows */
        .card {
            background: rgba(43, 17, 24, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            /* Gold & Rose Gold Metallic Border */
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.5),
                inset 0 0 15px rgba(212, 175, 55, 0.15),
                0 0 30px rgba(200, 137, 150, 0.2);
            max-width: 750px;
            width: 100%;
            margin: 0 auto;
            padding: 50px 40px;
            text-align: center;
            position: relative;
            z-index: 1;
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        /* Elegant Luxury Header */
        h1 {
            font-family: 'Charmonman', cursive, serif;
            font-weight: 700;
            font-size: 2.5rem;
            margin-bottom: 30px;
            /* Metallic Gold Text Gradient */
            background: linear-gradient(180deg, #fff2db 0%, #d4af37 50%, #aa7c11 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
            letter-spacing: 1px;
        }

        /* Grid for Portfolio Projects */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 25px;
            margin: 35px 0;
        }

        /* Project Item - Glassmorphism & Gold Accent */
        .project-item {
            background: linear-gradient(145deg, rgba(74, 29, 40, 0.6), rgba(43, 17, 24, 0.8));
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 16px;
            padding: 30px 20px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
            overflow: hidden;
        }

        .project-item::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent);
            transition: left 0.7s ease;
        }

        .project-item:hover::before {
            left: 100%;
        }

        .project-item:hover {
            transform: translateY(-7px);
            border-color: rgba(212, 175, 55, 0.8);
            box-shadow: 
                0 15px 30px rgba(0, 0, 0, 0.4),
                0 0 20px rgba(212, 175, 55, 0.2);
        }

        .project-icon {
            font-size: 2.2rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 2px 5px rgba(212, 175, 55, 0.4));
        }

        .project-item h2 {
            font-family: 'Charmonman', cursive;
            color: #f3e5ab;
            font-size: 1.4rem;
            margin-bottom: 12px;
            font-weight: 700;
        }

        .project-item p {
            font-family: 'Krub', sans-serif;
            font-size: 0.95rem;
            color: #e2c0cc;
            line-height: 1.6;
            font-weight: 300;
        }

        /* Luxury Rose Gold Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 20px;
            padding: 14px 38px;
            background: linear-gradient(135deg, #c59357 0%, #e6a8b3 50%, #b86b7a 100%);
            color: #2b1118;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 1px;
            box-shadow: 
                0 10px 25px rgba(0, 0, 0, 0.4),
                0 0 15px rgba(230, 168, 179, 0.3);
            transition: all 0.4s ease;
            border: 1px solid #f3e5ab;
            position: relative;
            z-index: 2;
        }

        .btn:hover {
            transform: translateY(-3px) scale(1.03);
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #c59357 100%);
            box-shadow: 
                0 15px 30px rgba(0, 0, 0, 0.5),
                0 0 25px rgba(212, 175, 55, 0.5);
            color: #1a0a0f;
        }

        .btn-icon {
            font-size: 0.9rem;
            color: #2b1118;
        }

        /* Responsive spacing */
        @media (max-width: 600px) {
            .card {
                padding: 35px 20px;
            }
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>

    <!-- Ambient Luxury Background -->
    <div class="luxury-bg"></div>

    <div class="card">
        <h1>แฟ้มสะสมผลงาน</h1>

        <!-- รายการผลงาน/โครงการ -->
        <div class="portfolio-grid">
            <div class="project-item">
                <div class="project-icon">✦</div>
                <h2><span class="en-font" style="font-size: 1.5rem;">Web Development</span></h2>
                <p>โปรเจกต์พัฒนาเว็บไซต์ด้วย HTML, CSS และการโฮสต์บน GitHub Pages</p>
            </div>

            <div class="project-item">
                <div class="project-icon">✦</div>
                <h2><span class="en-font" style="font-size: 1.5rem;">Computer Science</span></h2>
                <p>การศึกษาและแก้ปัญหาทางวิทยาการคอมพิวเตอร์และการเขียนโปรแกรม</p>
            </div>
        </div>

        <!-- ปุ่มย้อนกลับหน้าแรก -->
        <a href="index.html" class="btn">
            <span class="btn-icon">◆</span>
            <span class="en-font">Back to Home</span>
            <span class="btn-icon">◆</span>
        </a>
    </div>

</body>
</html>
