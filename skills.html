<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทักษะและความสามารถ - Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="detail-page">
    <div class="ambient-glow"></div>
    <header class="navbar">
        <a href="portfolio.html" class="logo"><i class="fa-solid fa-arrow-left"></i> กลับหน้าเมนู</a>
        <div class="nav-title">SKILLS</div>
    </header>

    <main class="content-container">
        <div class="detail-card">
            <h2><i class="fa-solid fa-award"></i> ทักษะและความสามารถ</h2>
            <hr class="divider">
            <div class="skills-list">
                <div class="skill-bar-box">
                    <div class="skill-info"><span>Mathematics (คณิตศาสตร์)</span><span>80%</span></div>
                    <div class="bar-bg"><div class="bar-fill" style="width: 80%;"></div></div>
                </div>
                <div class="skill-bar-box">
                    <div class="skill-info"><span>English (ภาษาอังกฤษ)</span><span>70%</span></div>
                    <div class="bar-bg"><div class="bar-fill" style="width: 70%;"></div></div>
                </div>
                <div class="skill-bar-box">
                    <div class="skill-info"><span>Leadership (ภาวะผู้นำ)</span><span>95%</span></div>
                    <div class="bar-bg"><div class="bar-fill" style="width: 95%;"></div></div>
                </div>
                <div class="skill-bar-box">
                    <div class="skill-info"><span>Communication (การสื่อสาร)</span><span>90%</span></div>
                    <div class="bar-bg"><div class="bar-fill" style="width: 90%;"></div></div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
