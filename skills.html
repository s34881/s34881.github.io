<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ทักษะและความสามารถ - Siranata Pholthekong</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow"></div>
    <header>
        <a href="portfolio.html" class="logo">PORTFOLIO</a>
        <a href="portfolio.html" class="btn-back"><i class="fa-solid fa-arrow-left"></i> กลับหน้า Portfolio</a>
    </header>

    <div class="container">
        <div class="detail-card">
            <h1 class="page-title"><i class="fa-solid fa-star"></i> ทักษะและความสามารถ (Skills)</h1>
            <div class="skills-grid">
                <div class="skill-item">
                    <div class="skill-info"><span>Mathematics (คณิตศาสตร์)</span><span>80%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: 80%;"></div></div>
                </div>
                <div class="skill-item">
                    <div class="skill-info"><span>English (ภาษาอังกฤษ)</span><span>70%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: 70%;"></div></div>
                </div>
                <div class="skill-item">
                    <div class="skill-info"><span>Leadership (ภาวะผู้นำ)</span><span>95%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: 95%;"></div></div>
                </div>
                <div class="skill-item">
                    <div class="skill-info"><span>Communication (การสื่อสาร)</span><span>90%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: 90%;"></div></div>
                </div>
                <div class="skill-item" style="grid-column: span 1;">
                    <div class="skill-info"><span>Creativity (ความคิดสร้างสรรค์)</span><span>88%</span></div>
                    <div class="progress-bar"><div class="progress-fill" style="width: 88%;"></div></div>
                </div>
            </div>
        </div>
    </div>
