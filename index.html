<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Welcome to Siranata's World ✨</title>

    <!-- Google Fonts: Mali & Great Vibes -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Mali:wght@400;600&display=swap" rel="stylesheet">

    <style>
        .en-font {
            font-family: 'Great Vibes', cursive !important;
            letter-spacing: 1px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Mali', cursive, sans-serif;
            font-size: 1.1rem;
            
            /* เปลี่ยนชื่อไฟล์ภาพพื้นหลังเป็นชื่อรูปใน GitHub แล้ว */
            background-image: url('1788762340483.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0a0a0c;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
        }

        .card {
            background: rgba(25, 10, 18, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 35px;
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.35), 0 15px 35px rgba(0, 0, 0, 0.7);
            border: 2px solid rgba(244, 114, 182, 0.6);
            outline: 2px dashed rgba(251, 207, 232, 0.5);
            outline-offset: -10px;
            max-width: 480px;
            width: 100%;
            padding: 35px 25px;
            text-align: center;
        }

        .profile-wrapper {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px auto;
            position: relative;
        }

        .profile {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 0 20px rgba(244, 114, 182, 0.6);
        }

        .profile-wrapper::after {
            content: '✨👑✨';
            position: absolute;
            top: -15px;
            right: -8px;
            font-size: 22px;
        }

        h1 {
            color: #fbcfe8;
            font-size: 1.8rem;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(244, 114, 182, 0.6);
        }

        p {
            line-height: 1.6;
            color: #fce7f3;
            margin-bottom: 12px;
        }

        .highlight-box {
            background: rgba(244, 114, 182, 0.15);
            border: 2px dashed #f472b6;
            border-radius: 20px;
            padding: 15px;
            margin: 20px 0;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px 30px;
            background: linear-gradient(45deg, #ec4899, #db2777);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.2rem;
            box-shadow: 0 0 15px rgba(236, 72, 153, 0.6);
            border: 2px solid #ffffff;
            transition: all 0.3s ease;
        }

        .btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(236, 72, 153, 0.9);
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="profile-wrapper">
            <img src="Screenshot 2026-06-30 103336.png" alt="Profile" class="profile">
        </div>

        <h1>✨ ยินดีต้อนรับสู่แฟ้มสะสมผลงานของฉัน ✨</h1>

        <p>สวัสดีค่ะ! ฉันชื่อ <strong style="color: #f472b6;">ศิรณตา (<span class="en-font" style="font-size: 1.5rem;">Siranata</span>)</strong> 💖</p>

        <div class="highlight-box">
            <p style="margin-bottom: 0;">
                ขณะนี้กำลังสนใจด้าน <br>
                <strong style="font-size: 1.2rem; color: #f472b6;">บริหารโลจิสติกส์ (<span class="en-font" style="font-size: 1.4rem;">Logistics Management</span>)</strong>
            </p>
        </div>

        <a href="portfolio.html" class="btn">
            <span>✨</span>
            <span class="en-font">View Portfolio</span>
            <span>✨</span>
        </a>
    </div>

</body>
</html>
