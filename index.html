<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Siranata Pholthekong</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdf8fa;
            --chula-pink: #DE5C8E;
            --chula-pink-dark: #a83261;
            --chula-pink-light: #fbeaf0;
            --accent-gold: #c5a059;
            --text-main: #2b2b2b;
            --text-subtle: #757575;
            --border-pink: rgba(222, 92, 142, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: none; /* ซ่อน Cursor ปกติเพื่อใช้ Custom Cursor */
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            user-select: none;
        }

        /* 1. Dynamic Interactive Spotlight Background */
        .spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(
                700px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(222, 92, 142, 0.18),
                transparent 80%
            );
            z-index: 1;
        }

        /* 2. Soft Floating Particles Layer */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: var(--chula-pink);
            border-radius: 50%;
            opacity: 0.35;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(100vh) scale(0); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
        }

        /* 3. Custom Interactive Cursor Follower */
        .custom-cursor {
            position: fixed;
            width: 90px;
            height: 90px;
            border: 1px solid var(--chula-pink);
            background: rgba(222, 92, 142, 0.08);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease-out, background 0.3s ease;
            backdrop-filter: blur(2px);
        }

        .cursor-text {
            font-family: 'Cinzel', serif;
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: var(--chula-pink-dark);
            font-weight: 700;
            text-align: center;
        }

        .cursor-dot {
            position: fixed;
            width: 8px;
            height: 8px;
            background: var(--chula-pink-dark);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 1000;
        }

        /* 4. Main Content Container (ไร้กรอบ ไร้ปุ่ม) */
        .hero-container {
            position: relative;
            z-index: 10;
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            text-align: center;
            transition: transform 0.8s cubic-bezier(0.7, 0, 0.3, 1), opacity 0.8s ease, filter 0.8s ease;
        }

        /* Animation ตัวหนังสือลอยขึ้นมา */
        @keyframes floatUpFade {
            0% { opacity: 0; transform: translateY(35px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-item {
            opacity: 0;
            animation: floatUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }

        /* Badge Upper Title */
        .tag-badge {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 5px;
            color: var(--chula-pink-dark);
            text-transform: uppercase;
            margin-bottom: 1.8rem;
            padding: 0.4rem 1.4rem;
            background: rgba(222, 92, 142, 0.08);
            border: 1px solid var(--border-pink);
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(222, 92, 142, 0.08);
        }

        /* Name Section */
        .name-container {
            margin-bottom: 1.8rem;
        }

        h1.name-th {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1px;
            line-height: 1.2;
            text-shadow: 0 5px 20px rgba(222, 92, 142, 0.1);
        }

        .name-en {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--chula-pink-dark);
            margin-top: 0.5rem;
            display: block;
            text-transform: uppercase;
        }

        /* School Name Section */
        .school-container {
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        .school-th {
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--text-main);
            display: block;
        }

        .school-highlight {
            color: var(--chula-pink-dark);
            font-weight: 700;
            position: relative;
            display: inline-block;
        }

        .school-highlight::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--chula-pink), transparent);
        }

        .school-en {
            font-size: 0.95rem;
            color: var(--text-subtle);
            letter-spacing: 1px;
            display: block;
            margin-top: 0.4rem;
            font-style: italic;
        }

        /* Interactive Scroll / Tap Indicator (แทนปุ่ม) */
        .action-hint {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--chula-pink-dark);
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .mouse-icon {
            width: 24px;
            height: 38px;
            border: 2px solid var(--chula-pink);
            border-radius: 15px;
            position: relative;
        }

        .mouse-wheel {
            width: 4px;
            height: 8px;
            background-color: var(--chula-pink-dark);
            border-radius: 2px;
            position: absolute;
            top: 6px;
            left: 50%;
            transform: translateX(-50%);
            animation: scrollWheel 1.8s infinite;
        }

        @keyframes scrollWheel {
            0% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, 14px); }
        }

        /* 5. CINEMATIC PORTAL OVERLAY TRANSITION */
        .portal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle, var(--chula-pink-light) 0%, var(--bg-color) 60%, var(--chula-pink) 100%);
            z-index: 9999;
            clip-path: circle(0% at 50% 50%);
            transition: clip-path 0.85s cubic-bezier(0.7, 0, 0.2, 1);
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }

        .portal-overlay.active {
            clip-path: circle(150% at 50% 50%);
        }

        .portal-loader-text {
            font-family: 'Cinzel', serif;
            font-size: 1.2rem;
            letter-spacing: 6px;
            color: var(--chula-pink-dark);
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s ease 0.3s;
            text-transform: uppercase;
            font-weight: 700;
        }

        .portal-overlay.active .portal-loader-text {
            opacity: 1;
            transform: translateY(0);
        }

        /* Warp out Animation */
        .warp-out {
            transform: scale(1.15) translateY(-25px);
            opacity: 0;
            filter: blur(8px);
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 25px;
            color: var(--text-subtle);
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            z-index: 10;
        }

        /* Responsive */
        @media (max-width: 600px) {
            * { cursor: auto; } /* คืนค่า Cursor ปกติในมือถือ */
            .custom-cursor, .cursor-dot { display: none; }
            h1.name-th { font-size: 1.9rem; }
            .name-en { font-size: 1rem; }
            .school-th { font-size: 1.05rem; }
            .school-en { font-size: 0.8rem; }
            .hero-container { padding: 1.2rem; }
        }
    </style>
</head>
<body onclick="triggerPortalTransition(event)">

    <!-- Light Interactive Spotlight Background Layer -->
    <div class="spotlight" id="spotlight"></div>

    <!-- Light Floating Particles Layer -->
    <div class="particles-container" id="particles"></div>

    <!-- Custom Cursor Follower -->
    <div class="custom-cursor" id="customCursor">
        <span class="cursor-text">CLICK OR<br>SCROLL</span>
    </div>
    <div class="cursor-dot" id="cursorDot"></div>

    <!-- Cinematic Portal Overlay Wipe Effect -->
    <div class="portal-overlay" id="portalOverlay">
        <div class="portal-loader-text">Loading Portfolio...</div>
    </div>

    <!-- Main Content Container -->
    <main class="hero-container" id="heroContent">
        
        <!-- Badge -->
        <div class="animate-item delay-1">
            <div class="tag-badge">PORTFOLIO</div>
        </div>
        
        <!-- ชื่อภาษาไทยและภาษาอังกฤษ -->
        <div class="name-container animate-item delay-2">
            <h1 class="name-th">นางสาวศิรณตา พลเทกอง</h1>
            <span class="name-en">Siranata Pholthekong</span>
        </div>
        
        <!-- ชื่อโรงเรียนภาษาไทยและภาษาอังกฤษ -->
        <div class="school-container animate-item delay-3">
            <span class="school-th">โรงเรียนบ้านบึง <span class="school-highlight">“อุตสาหกรรมนุเคราะห์”</span></span>
            <span class="school-en">Banbung Uttsahakamnukroh School</span>
        </div>

        <!-- Interactive Hint (ไม่มีปุ่ม ใช้การ Scroll / Tap แทน) -->
        <div class="animate-item delay-4">
            <div class="action-hint">
                <div class="mouse-icon"><div class="mouse-wheel"></div></div>
                <span>Scroll Down or Click Anywhere</span>
            </div>
        </div>

    </main>

    <footer>
        &copy; SIRANATA PHOLTHEKONG — ALL RIGHTS RESERVED
    </footer>

    <!-- Interactive Scripts -->
    <script>
        // Custom Cursor Follower Script
        const customCursor = document.getElementById('customCursor');
        const cursorDot = document.getElementById('cursorDot');
        const spotlight = document.getElementById('spotlight');

        document.addEventListener('mousemove', (e) => {
            // Cursor Follower
            customCursor.style.left = `${e.clientX}px`;
            customCursor.style.top = `${e.clientY}px`;
            cursorDot.style.left = `${e.clientX}px`;
            cursorDot.style.top = `${e.clientY}px`;

            // Spotlight Position
            spotlight.style.setProperty('--mouse-x', `${e.clientX}px`);
            spotlight.style.setProperty('--mouse-y', `${e.clientY}px`);
        });

        // Floating Particles Effect
        const particlesContainer = document.getElementById('particles');
        const particleCount = 22;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const size = Math.random() * 5 + 3;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDuration = `${Math.random() * 8 + 5}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            
            particlesContainer.appendChild(particle);
        }

        // Trigger Transition State Guard
        let isTransitioning = false;

        function triggerPortalTransition(e) {
            if (isTransitioning) return;
            isTransitioning = true;

            const portalOverlay = document.getElementById('portalOverlay');
            const heroContent = document.getElementById('heroContent');
            
            // ใช้ตำแหน่งที่คลิก หรือจุดศูนย์กลางหน้าจอถ้าเป็นกรณีการ Scroll
            const clickX = e ? e.clientX : window.innerWidth / 2;
            const clickY = e ? e.clientY : window.innerHeight / 2;

            portalOverlay.style.clipPath = `circle(0% at ${clickX}px ${clickY}px)`;
            heroContent.classList.add('warp-out');

            setTimeout(() => {
                portalOverlay.style.clipPath = `circle(150% at ${clickX}px ${clickY}px)`;
                portalOverlay.classList.add('active');
            }, 50);

            setTimeout(() => {
                window.location.href = 'portfolio.html';
            }, 850);
        }

        // Scroll & Wheel Gesture Detector (เลื่อนเมาส์ลงเพื่อวาร์ป)
        window.addEventListener('wheel', (e) => {
            if (e.deltaY > 20) {
                triggerPortalTransition(null);
            }
        });

        // Mobile Touch Swipe Gesture Detector (รูดนิ้วขึ้นเพื่อวาร์ป)
        let touchStartY = 0;
        window.addEventListener('touchstart', (e) => {
            touchStartY = e.touches[0].clientY;
        });

        window.addEventListener('touchend', (e) => {
            const touchEndY = e.changedTouches[0].clientY;
            if (touchStartY - touchEndY > 40) { // รูดขึ้นมากกว่า 40px
                triggerPortalTransition(null);
            }
        });
    </script>
</body>
</html>
