<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siranata Pholthekong - Welcome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="ambient-glow"></div>
    <canvas id="particleCanvas"></canvas>

    <div class="hero-wrapper">
        <div class="profile-img-box">
            <img src="1788760432866.jpg" alt="นางสาวศิรณตา พลเทกอง">
        </div>
        <div class="hero-badge">PORTFOLIO</div>
        <h1 class="hero-name-th">นางสาวศิรณตา พลเทกอง</h1>
        <div class="hero-name-en">SIRANATA PHOLTHEKONG</div>
        
        <div class="hero-school-box">
            <div class="hero-school-th">โรงเรียนบ้านบึง <span>“อุตสาหกรรมนุเคราะห์”</span></div>
            <div class="hero-school-en">BANBUNG UTTSAHAKAMNUKROH SCHOOL</div>
        </div>

        <!-- ปุ่มกดเข้าสู่หน้า Portfolio การ์ดข้อมูล -->
        <a href="portfolio.html" class="btn-enter">
            <span>เข้าชม Portfolio</span>
            <i class="fa-solid fa-arrow-right"></i>
        </a>
    </div>

    <footer>
        © SIRANATA PHOLTHEKONG — ALL RIGHTS RESERVED
    </footer>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        const particles = [];
        for (let i = 0; i < 40; i++) {
            particles.push({
                x: Math.random() * canvas.width, y: Math.random() * canvas.height,
                radius: Math.random() * 2 + 0.5, dx: (Math.random() - 0.5) * 0.4, dy: (Math.random() - 0.5) * 0.4,
                opacity: Math.random() * 0.6 + 0.2
            });
        }
        function animateParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(222, 92, 142, ${p.opacity})`; ctx.fill();
                p.x += p.dx; p.y += p.dy;
                if (p.x < 0 || p.x > canvas.width) p.dx *= -1;
                if (p.y < 0 || p.y > canvas.height) p.dy *= -1;
            });
            requestAnimationFrame(animateParticles);
        }
        animateParticles();
    </script>
</body>
</html>
