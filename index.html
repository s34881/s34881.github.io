<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Siranata Pholthekong</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdf8fa;
            --chula-pink: #DE5C8E;
            --chula-pink-dark: #a83261;
            --chula-pink-light: #fbeaf0;
            --accent-gold: #c5a059;
            --text-main: #2b2b2b;
            --text-subtle: #757575;
            --border-pink: rgba(222, 92, 142, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 1. Dynamic Interactive Spotlight Background */
        .spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(
                700px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(222, 92, 142, 0.18),
                transparent 80%
            );
            z-index: 1;
        }

        /* 2. Soft Floating Particles Layer */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: var(--chula-pink);
            border-radius: 50%;
            opacity: 0.35;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 0.5;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* 3. Main Content Container (ไร้กรอบ ไร้พื้นหลัง) */
        .hero-container {
            position: relative;
            z-index: 10;
            padding: 2rem;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        /* Keyframes สำหรับตัวหนังสือค่อยๆ ลอยขึ้นมาทีละบรรทัด */
        @keyframes floatUpFade {
            0% {
                opacity: 0;
                transform: translateY(35px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-item {
            opacity: 0;
            animation: floatUpFade 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* กำหนดเวลาลอยขึ้นเหลื่อมกัน (Stagger Delay) */
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }

        /* Badge Upper Title */
        .tag-badge {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 5px;
            color: var(--chula-pink-dark);
            text-transform: uppercase;
            margin-bottom: 1.8rem;
            padding: 0.4rem 1.4rem;
            background: rgba(222, 92, 142, 0.08);
            border: 1px solid var(--border-pink);
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(222, 92, 142, 0.08);
        }

        /* Name Section */
        .name-container {
            margin-bottom: 1.8rem;
        }

        h1.name-th {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1px;
            line-height: 1.2;
            text-shadow: 0 5px 20px rgba(222, 92, 142, 0.1);
        }

        .name-en {
            font-family: 'Cinzel', serif;
            font-size: 1.35rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--chula-pink-dark);
            margin-top: 0.5rem;
            display: block;
            text-transform: uppercase;
        }

        /* School Name Section */
        .school-container {
            margin-bottom: 3rem;
            line-height: 1.7;
        }

        .school-th {
            font-size: 1.3rem;
            font-weight: 500;
            color: var(--text-main);
            display: block;
        }

        .school-highlight {
            color: var(--chula-pink-dark);
            font-weight: 700;
            position: relative;
            display: inline-block;
        }

        /* ขีดเส้นใต้เรืองแสงใต้ชื่อโรงเรียน */
        .school-highlight::after {
            content: '';
            position: absolute;
            bottom: -3px;
            left: 0;
            width: 100%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--chula-pink), transparent);
        }

        .school-en {
            font-size: 0.95rem;
            color: var(--text-subtle);
            letter-spacing: 1px;
            display: block;
            margin-top: 0.4rem;
            font-style: italic;
        }

        /* Light Interactive Portal Button */
        .btn-portal {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 1.1rem 3rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, var(--chula-pink), var(--chula-pink-dark));
            border-radius: 50px;
            box-shadow: 0 10px 30px rgba(222, 92, 142, 0.35);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-portal::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }

        .btn-portal:hover::before {
            left: 100%;
        }

        .btn-portal:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 15px 35px rgba(222, 92, 142, 0.5);
            background: linear-gradient(135deg, #e66898, var(--chula-pink-dark));
        }

        .btn-arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .btn-portal:hover .btn-arrow {
            transform: translateX(6px) scale(1.2);
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 25px;
            color: var(--text-subtle);
            font-size: 0.8rem;
            letter-spacing: 1.5px;
            z-index: 10;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1.name-th { font-size: 1.9rem; }
            .name-en { font-size: 1rem; }
            .school-th { font-size: 1.05rem; }
            .school-en { font-size: 0.8rem; }
            .hero-container { padding: 1.2rem; }
            .btn-portal { padding: 0.9rem 2.2rem; font-size: 0.95rem; }
        }
    </style>
</head>
<body>

    <!-- Light Interactive Spotlight Background Layer -->
    <div class="spotlight" id="spotlight"></div>

    <!-- Light Floating Particles Layer -->
    <div class="particles-container" id="particles"></div>

    <!-- Main Content Container (No Box Frame) -->
    <main class="hero-container">
        
        <!-- Badge -->
        <div class="animate-item delay-1">
            <div class="tag-badge">PORTFOLIO</div>
        </div>
        
        <!-- ชื่อภาษาไทยและภาษาอังกฤษ -->
        <div class="name-container animate-item delay-2">
            <h1 class="name-th">นางสาวศิรณตา พลเทกอง</h1>
            <span class="name-en">Siranata Pholthekong</span>
        </div>
        
        <!-- ชื่อโรงเรียนภาษาไทยและภาษาอังกฤษ -->
        <div class="school-container animate-item delay-3">
            <span class="school-th">โรงเรียนบ้านบึง <span class="school-highlight">“อุตสาหกรรมนุเคราะห์”</span></span>
            <span class="school-en">Banbung Uttsahakamnukroh School</span>
        </div>

        <!-- ปุ่มข้ามไปหน้า Portfolio -->
        <div class="animate-item delay-4">
            <a href="portfolio.html" class="btn-portal">
                <span>เข้าชมพอร์ตโฟลิโอ</span>
                <span class="btn-arrow">➔</span>
            </a>
        </div>

    </main>

    <footer>
        &copy; SIRANATA PHOLTHEKONG — ALL RIGHTS RESERVED
    </footer>

    <!-- Interactive Scripts -->
    <script>
        // Mouse Spotlight Effect
        const spotlight = document.getElementById('spotlight');

        document.addEventListener('mousemove', (e) => {
            spotlight.style.setProperty('--mouse-x', `${e.clientX}px`);
            spotlight.style.setProperty('--mouse-y', `${e.clientY}px`);
        });

        // Floating Particles Effect
        const particlesContainer = document.getElementById('particles');
        const particleCount = 22;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const size = Math.random() * 5 + 3;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDuration = `${Math.random() * 8 + 5}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
