<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Welcome to Siranata's World ✨</title>

    <!-- Google Fonts for Thai (Nithan) & Decorative Cursive English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nithan&family=Great+Vibes&family=Alex+Brush&display=swap" rel="stylesheet">

    <style>
        /* Custom English Font Definition with Fallbacks */
        .en-font {
            font-family: 'Great Vibes', 'Alex Brush', cursive, sans-serif !important;
            letter-spacing: 1px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Nithan', cursive, sans-serif;
            font-size: 1.25rem;
            /* Cream Lace Pattern Background */
            background-color: #fffdd0;
            background-image: 
                radial-gradient(#f3e5ab 10%, transparent 11%),
                radial-gradient(#f3e5ab 10%, transparent 11%),
                radial-gradient(rgba(243, 229, 171, 0.4) 20%, transparent 20%),
                radial-gradient(rgba(243, 229, 171, 0.4) 20%, transparent 20%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px, 15px 15px, 45px 45px;
            background-attachment: fixed;
            color: #8c5b68;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            position: relative;
        }

        /* Soft Pink Card Design */
        .card {
            background: rgba(255, 245, 247, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 35px;
            box-shadow: 
                0 10px 30px rgba(230, 180, 190, 0.3),
                inset 0 0 15px rgba(255, 255, 255, 0.8);
            border: 3px solid #fbcfe8;
            outline: 2px dashed #f472b6;
            outline-offset: -10px;
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            z-index: 1;
            transition: transform 0.4s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Profile Avatar Wrapper */
        .profile-wrapper {
            width: 160px;
            height: 160px;
            margin: 0 auto 22px auto;
            position: relative;
        }

        .profile {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ffffff;
            box-shadow: 0 8px 20px rgba(244, 114, 182, 0.25);
            transition: all 0.5s ease;
        }

        .profile-wrapper:hover .profile {
            transform: scale(1.05);
            box-shadow: 0 12px 25px rgba(244, 114, 182, 0.35);
        }

        h1 {
            color: #db2777;
            font-size: 2.2rem;
            margin-bottom: 12px;
            font-weight: normal;
        }

        p {
            font-size: 1.3rem;
            line-height: 1.8;
            color: #9d5c6f;
            margin-bottom: 14px;
        }

        p strong {
            color: #be185d;
        }

        .highlight-box {
            background: #ffe4e6;
            border: 2px dashed #f472b6;
            border-radius: 20px;
            padding: 16px 20px;
            margin: 20px 0 25px 0;
        }

        /* Soft Pink Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            padding: 12px 36px;
            background: #f472b6;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.3rem;
            box-shadow: 0 5px 15px rgba(244, 114, 182, 0.4);
            transition: all 0.3s ease;
            border: 2px solid #ffffff;
        }

        .btn:hover {
            background: #ec4899;
            transform: scale(1.05) translateY(-2px);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.5);
        }
    </style>
</head>

<body>

    <div class="card">
        <!-- รูปโปรไฟล์ -->
        <div class="profile-wrapper">
            <img src="Screenshot 2026-06-30 103336.png" alt="รูปโปรไฟล์ของศิรณตา" class="profile">
        </div>

        <h1>ยินดีต้อนรับสู่แฟ้มสะสมผลงานของฉัน</h1>

        <p>สวัสดีค่ะ! ฉันชื่อ <strong>ศิรณตา (<span class="en-font" style="font-size: 1.6rem;">Siranata</span>)</strong></p>

        <div class="highlight-box">
            <p style="margin-bottom: 0;">
                ขณะนี้กำลังสนใจด้าน <br>
                <strong style="font-size: 1.4rem; color: #be185d;">บริหารโลจิสติกส์ (<span class="en-font" style="font-size: 1.5rem;">Logistics Management</span>)</strong>
            </p>
        </div>

        <!-- ปุ่มไปหน้าถัดไป -->
        <a href="portfolio.html" class="btn">
            <span class="en-font">View Portfolio</span>
        </a>
    </div>

</body>
</html>
