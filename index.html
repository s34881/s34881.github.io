<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หน้าแนะนำตัวของฉัน</title>

<style>
body {
    background-color: #dbbc8c;
    color: #333;
    text-align: center;
    padding: 50px;
    font-family: Arial, sans-serif;
}

.card {
    background: white;
    border-radius: 30px;
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    max-width: 500px;
    margin: 0 auto;
    padding: 30px;
}

.profile {
    width: 150px;
    height: 150px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid #dbbc8c;
    margin-bottom: 20px;
}

h1 {
    color: #3a3420;
}

p {
    font-size: 18px;
    line-height: 1.6;
}

.btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 24px;
    background-color: #3a3420;
    color: white;
    text-decoration: none;
    border-radius: 10px;
    font-size: 18px;
    transition: 0.3s;
}

.btn:hover {
    background-color: #5c5134;
}
</style>

</head>

<body>

<div class="card">

    <!-- รูปโปรไฟล์ -->
    <img src="Screenshot 2026-06-30 103336.png" alt="รูปโปรไฟล์ของศิรณตา" class="profile">

    <h1>ยินดีต้อนรับสู่โปรไฟล์ของฉัน</h1>

    <p>สวัสดีค่ะ! ฉันชื่อ <strong>ศิรณตา (Siranata)</strong></p>

    <p>ขณะนี้กำลังศึกษา/สนใจด้าน <strong>Computer Science & Engineering</strong></p>

    <p>นี่คือเว็บไซต์แรกของฉันที่โฮสต์บน GitHub Pages!</p>

    <!-- ปุ่มไปหน้าถัดไป -->
    <a href="portfolio.html" class="btn">ดูแฟ้มสะสมผลงาน</a>

</div>

</body>
</html>
