<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Welcome to Siranata's World ✨</title>

    <!-- Google Fonts for Thai & Decorative Cursive English -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Alex+Brush&family=Mali:ital,wght@0,400;0,600;0,700;1,500&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        /* Custom English Font Definition with Fallbacks */
        .en-font {
            font-family: 'Rosita', 'ITC Blackadder', 'Aston Script', 'Beautiful Friends', 'Great Vibes', 'Alex Brush', cursive, sans-serif !important;
            letter-spacing: 1px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Mali', cursive, sans-serif;
            background: radial-gradient(circle at top left, #fff0f5, #ffd1dc, #fbcfe8, #f472b6);
            background-attachment: fixed;
            color: #5c2c3b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 15px;
            position: relative;
            overflow-x: hidden;
        }

        /* Whimsical & Bedazzled Sparkle Particle Overlay */
        .bedazzled-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 40px 70px, #ffb6c1, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(3px 3px at 160px 120px, #ffe4e1, rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 200px 200px;
            animation: bedazzleShimmer 4s infinite linear;
            opacity: 0.75;
        }

        @keyframes bedazzleShimmer {
            0% { transform: translateY(0); }
            100% { transform: translateY(-200px); }
        }

        /* Floating Elements */
        .floating-item {
            position: fixed;
            font-size: 28px;
            opacity: 0.8;
            filter: drop-shadow(0 0 8px rgba(255, 182, 193, 0.8));
            animation: whimsicalFloat 7s infinite ease-in-out alternate;
            z-index: 0;
        }

        .item-1 { top: 10%; left: 8%; animation-duration: 6s; }
        .item-2 { top: 15%; right: 10%; animation-duration: 8s; }
        .item-3 { bottom: 15%; left: 10%; animation-duration: 7s; }
        .item-4 { bottom: 10%; right: 8%; animation-duration: 9s; }

        @keyframes whimsicalFloat {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            50% { transform: translateY(-20px) rotate(12deg) scale(1.1); }
            100% { transform: translateY(-35px) rotate(-10deg) scale(0.95); }
        }

        /* Whimsical Bedazzled Main Card */
        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 35px;
            box-shadow: 
                0 0 25px rgba(255, 182, 193, 0.7),
                0 15px 35px rgba(219, 112, 147, 0.3),
                inset 0 0 15px rgba(255, 255, 255, 0.9);
            border: 4px solid #f472b6;
            outline: 3px dashed #fbcfe8;
            outline-offset: -10px;
            max-width: 520px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 30px;
            text-align: center;
            position: relative;
            z-index: 1;
            transition: transform 0.4s ease;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        /* Profile Avatar Wrapper */
        .profile-wrapper {
            width: 160px;
            height: 160px;
            margin: 0 auto 22px auto;
            position: relative;
        }

        .profile {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #ffffff;
            box-shadow: 
                0 0 0 4px #f472b6,
                0 10px 25px rgba(236, 72, 153, 0.4);
            transition: all 0.5s ease;
        }

        .profile-wrapper:hover .profile {
            transform: scale(1.08) rotate(5deg);
            box-shadow: 
                0 0 0 6px #ec4899,
                0 15px 30px rgba(236, 72, 153, 0.6);
        }

        .profile-wrapper::after {
            content: '✨👑✨';
            position: absolute;
            top: -18px;
            right: -10px;
            font-size: 26px;
        }

        h1 {
            color: #db2777;
            font-size: 2.1rem;
            margin-bottom: 12px;
            text-shadow: 2px 2px 4px #fbcfe8, 0 0 10px #f472b6;
        }

        p {
            font-family: 'Prompt', sans-serif;
            font-size: 1.05rem;
            line-height: 1.8;
            color: #6b21a8;
            margin-bottom: 14px;
        }

        p strong {
            color: #be185d;
        }

        .highlight-box {
            background: linear-gradient(135deg, #fff0f5, #ffe4e1);
            border: 2px dashed #f472b6;
            border-radius: 20px;
            padding: 16px 20px;
            margin: 20px 0 25px 0;
            box-shadow: inset 0 0 10px rgba(255, 255, 255, 0.8);
        }

        /* Whimsical Bedazzled Button */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
            padding: 15px 36px;
            background: linear-gradient(45deg, #f472b6, #db2777, #ec4899);
            background-size: 200% 200%;
            animation: gradientBtn 3s ease infinite;
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-size: 1.15rem;
            font-weight: bold;
            box-shadow: 
                0 0 20px rgba(236, 72, 153, 0.5),
                0 10px 25px rgba(219, 39, 119, 0.4);
            transition: all 0.3s ease;
            border: 3px solid #ffffff;
        }

        @keyframes gradientBtn {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn:hover {
            transform: scale(1.08) translateY(-3px);
            box-shadow: 0 0 30px rgba(236, 72, 153, 0.85);
        }
    </style>
</head>

<body>

    <!-- Sparkle Particles & Floating Decorative Icons -->
    <div class="bedazzled-bg"></div>
    <div class="floating-item item-1">💎</div>
    <div class="floating-item item-2">🎀</div>
    <div class="floating-item item-3">✨</div>
    <div class="floating-item item-4">🌸</div>

    <div class="card">
        <!-- รูปโปรไฟล์ -->
        <div class="profile-wrapper">
            <img src="Screenshot 2026-06-30 103336.png" alt="รูปโปรไฟล์ของศิรณตา" class="profile">
        </div>

        <h1>✨ ยินดีต้อนรับสู่โปรไฟล์ของฉัน ✨</h1>

        <p>สวัสดีค่ะ! ฉันชื่อ <strong>ศิรณตา (<span class="en-font" style="font-size: 1.4rem;">Siranata</span>)</strong> 💖</p>

        <div class="highlight-box">
            <p style="margin-bottom: 0;">
                ขณะนี้กำลังสนใจด้าน <br>
                <strong style="font-size: 1.2rem; color: #be185d;">บริหารโลจิสติกส์ (<span class="en-font" style="font-size: 1.3rem;">Logistics Management</span>)</strong>
            </p>
        </div>

        <!-- ปุ่มไปหน้าถัดไป -->
        <a href="portfolio.html" class="btn">
            <span>💖</span>
            <span class="en-font">View Portfolio</span>
            <span>✨</span>
        </a>
    </div>

</body>
</html>
