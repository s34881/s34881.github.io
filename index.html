<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Siranata Pholthekong</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #fdf8f9;
            --card-bg: #ffffff;
            --primary-text: #2b2b2b;
            --secondary-text: #5e5e5e;
            --chula-pink: #DE5C8E;
            --chula-pink-dark: #b83d6e;
            --chula-pink-light: #fbeaf0;
            --border-color: #f3d2de;
            --accent-gold: #c5a059;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--primary-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            overflow-x: hidden;
            background: radial-gradient(circle at 50% 30%, #fcecf2 0%, var(--bg-color) 70%);
        }

        /* Hero Container */
        .welcome-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 3.5rem 2.5rem;
            margin: auto 1.5rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(222, 92, 142, 0.08);
            position: relative;
            animation: fadeInUp 0.8s ease-out;
        }

        /* Profile Image Frame */
        .avatar-frame {
            width: 140px;
            height: 140px;
            margin: 0 auto 1.5rem;
            border-radius: 50%;
            padding: 4px;
            background: linear-gradient(135deg, var(--chula-pink), var(--accent-gold));
            box-shadow: 0 8px 20px rgba(222, 92, 142, 0.2);
            transition: transform 0.4s ease;
        }

        .avatar-frame:hover {
            transform: scale(1.05) rotate(2deg);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background-color: #f0f0f0;
        }

        /* Typography */
        .welcome-tag {
            font-family: 'Cinzel', serif;
            color: var(--chula-pink);
            letter-spacing: 3px;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            color: var(--primary-text);
            margin-bottom: 0.3rem;
        }

        p.subtitle {
            font-size: 1rem;
            color: var(--secondary-text);
            font-weight: 400;
            margin-bottom: 2rem;
        }

        /* Action Button */
        .btn-enter {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: linear-gradient(135deg, var(--chula-pink), var(--chula-pink-dark));
            color: #ffffff;
            text-decoration: none;
            padding: 0.9rem 2.2rem;
            border-radius: 50px;
            font-size: 1.05rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            box-shadow: 0 6px 20px rgba(222, 92, 142, 0.3);
            transition: all 0.3s ease;
        }

        .btn-enter:hover {
            background: linear-gradient(135deg, var(--chula-pink-dark), var(--chula-pink));
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(222, 92, 142, 0.45);
        }

        .btn-enter span {
            transition: transform 0.3s ease;
        }

        .btn-enter:hover span {
            transform: translateX(4px);
        }

        /* Animation Keyframes */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Footer */
        footer {
            padding: 1.5rem;
            color: var(--secondary-text);
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <main class="welcome-card">
        <div class="avatar-frame">
            <img src="1788760432866.jpg" alt="นางสาวศิรณตา พลเทกอง" class="avatar-img">
        </div>
        
        <div class="welcome-tag">Welcome to my world</div>
        <h1>นางสาวศิรณตา พลเทกอง</h1>
        <p class="subtitle">แฟ้มสะสมผลงานอิเล็กทรอนิกส์ (E-Portfolio)</p>

        <a href="portfolio.html" class="btn-enter">
            เข้าชม Portfolio <span>→</span>
        </a>
    </main>

    <footer>
        <p>&copy; Portfolio - Siranata Pholthekong. All Rights Reserved.</p>
    </footer>

</body>
</html>
