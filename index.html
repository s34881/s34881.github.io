<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Siranata Pholthekong</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0d070b;
            --chula-pink: #DE5C8E;
            --chula-pink-bright: #ff69ab;
            --chula-pink-dark: #b83d6e;
            --accent-gold: #e5c158;
            --text-light: #ffffff;
            --text-subtle: #d6b8c5;
            --border-glow: rgba(222, 92, 142, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Prompt', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* 1. Dynamic Interactive Spotlight Background */
        .spotlight {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            background: radial-gradient(
                650px circle at var(--mouse-x, 50%) var(--mouse-y, 50%),
                rgba(222, 92, 142, 0.2),
                transparent 80%
            );
            z-index: 1;
        }

        /* 2. Floating Particle Effect */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .particle {
            position: absolute;
            background: var(--chula-pink);
            border-radius: 50%;
            opacity: 0.6;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            50% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) scale(1.2);
                opacity: 0;
            }
        }

        /* 3. Main Glassmorphism 3D Card */
        .card-wrapper {
            perspective: 1000px;
            z-index: 10;
            padding: 1.5rem;
            width: 100%;
            max-width: 620px;
        }

        .hero-card {
            background: rgba(255, 255, 255, 0.035);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 28px;
            padding: 3.5rem 2.2rem;
            text-align: center;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
            transform-style: preserve-3d;
            transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        /* Shimmer Lighting Line Pass */
        .hero-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.06),
                transparent
            );
            transform: rotate(45deg);
            animation: shimmerPass 6s infinite;
        }

        @keyframes shimmerPass {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        /* Badge Upper Title */
        .tag-badge {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            letter-spacing: 4px;
            color: var(--chula-pink-bright);
            text-transform: uppercase;
            margin-bottom: 1.5rem;
            padding: 0.35rem 1.3rem;
            background: rgba(222, 92, 142, 0.12);
            border: 1px solid rgba(222, 92, 142, 0.35);
            border-radius: 30px;
            box-shadow: 0 0 15px rgba(222, 92, 142, 0.2);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 10px rgba(222, 92, 142, 0.2); }
            to { box-shadow: 0 0 25px rgba(255, 105, 171, 0.55); }
        }

        /* Glowing Name Title */
        h1.name-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #ffffff 20%, var(--chula-pink-bright) 70%, var(--accent-gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 30px rgba(222, 92, 142, 0.3);
            letter-spacing: 0.5px;
        }

        /* School Name Section */
        .school-container {
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        .school-title {
            font-size: 1.15rem;
            font-weight: 500;
            color: var(--text-subtle);
            display: block;
            margin-bottom: 0.2rem;
        }

        .school-highlight {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 0.5px;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            position: relative;
            display: inline-block;
        }

        .quote-symbol {
            color: var(--chula-pink-bright);
            font-weight: 800;
            text-shadow: 0 0 10px var(--chula-pink);
        }

        /* Futuristic Interactive Button */
        .btn-portal {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 1.1rem 2.8rem;
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
            text-decoration: none;
            background: linear-gradient(135deg, var(--chula-pink), var(--chula-pink-dark));
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 0 20px rgba(222, 92, 142, 0.4),
                        0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2;
        }

        .btn-portal::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            transition: 0.5s;
        }

        .btn-portal:hover::before {
            left: 100%;
        }

        .btn-portal:hover {
            transform: translateY(-4px) scale(1.05);
            box-shadow: 0 0 35px rgba(255, 105, 171, 0.85),
                        0 15px 35px rgba(0, 0, 0, 0.6);
            background: linear-gradient(135deg, var(--chula-pink-bright), var(--chula-pink));
        }

        .btn-arrow {
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .btn-portal:hover .btn-arrow {
            transform: translateX(6px) scale(1.2);
        }

        /* Footer */
        footer {
            position: absolute;
            bottom: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* Responsive */
        @media (max-width: 600px) {
            h1.name-title { font-size: 1.65rem; }
            .school-title { font-size: 1rem; }
            .school-highlight { font-size: 1.1rem; }
            .hero-card { padding: 2.8rem 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- Interactive Spotlight Background Layer -->
    <div class="spotlight" id="spotlight"></div>

    <!-- Particles Layer -->
    <div class="particles-container" id="particles"></div>

    <!-- Main Card -->
    <div class="card-wrapper">
        <main class="hero-card" id="tiltCard">
            
            <div class="tag-badge">ELECTRONIC PORTFOLIO</div>
            
            <!-- ชื่อของคุณ -->
            <h1 class="name-title">นางสาวศิรณตา พลเทกอง</h1>
            
            <!-- ชื่อโรงเรียน -->
            <div class="school-container">
                <span class="school-title">โรงเรียนบ้านบึง</span>
                <span class="school-highlight"><span class="quote-symbol">“</span>อุตสาหกรรมนุเคราะห์<span class="quote-symbol">”</span></span>
            </div>

            <!-- ปุ่มวาร์ปไปหน้า Portfolio -->
            <a href="portfolio.html" class="btn-portal">
                <span>ค้นพบเรื่องราวของฉัน</span>
                <span class="btn-arrow">➔</span>
            </a>

        </main>
    </div>

    <footer>
        &copy; SIRANATA PHOLTHEKONG — ALL RIGHTS RESERVED
    </footer>

    <!-- Interactive Scripts -->
    <script>
        // Mouse Spotlight & 3D Tilt Effect
        const spotlight = document.getElementById('spotlight');
        const card = document.getElementById('tiltCard');

        document.addEventListener('mousemove', (e) => {
            // Spotlight Position
            spotlight.style.setProperty('--mouse-x', `${e.clientX}px`);
            spotlight.style.setProperty('--mouse-y', `${e.clientY}px`);

            // 3D Tilt Card
            const rect = card.getBoundingClientRect();
            const x = e.clientX - rect.left - rect.width / 2;
            const y = e.clientY - rect.top - rect.height / 2;

            const rotateX = (-y / rect.height) * 16;
            const rotateY = (x / rect.width) * 16;

            card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
        });

        // Reset Card when Mouse leaves
        document.addEventListener('mouseleave', () => {
            card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        });

        // Floating Particles Effect
        const particlesContainer = document.getElementById('particles');
        const particleCount = 25;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            const size = Math.random() * 4 + 2;
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.animationDuration = `${Math.random() * 8 + 4}s`;
            particle.style.animationDelay = `${Math.random() * 5}s`;
            
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
