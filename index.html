<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siranata | Official Portfolio</title>

    <!-- Google Fonts: Cormorant Garamond (English Luxury) & Prompt (Thai High-End) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        .en-font {
            font-family: 'Cormorant Garamond', serif !important;
            font-style: italic;
            font-weight: 600;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            font-size: 1rem;
            
            /* ดึงไฟล์ GIF หรือภาพพื้นหลังของคุณ */
            background-image: url('8b1f2eb7b221c60e0caf5d1f31111518.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0d0d0d;
            color: #2b2b2b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* การ์ดทรงสูงเรียบหรู ครีมออฟไวท์ทึบ */
        .card {
            background: #FAF8F5;
            border-radius: 16px;
            box-shadow: 
                0 20px 50px rgba(0, 0, 0, 0.6),
                0 0 30px rgba(212, 163, 115, 0.2);
            border: 1px solid #E6C594;
            outline: 1px solid rgba(212, 163, 115, 0.4);
            outline-offset: -8px;
            max-width: 480px;
            width: 100%;
            padding: 45px 35px;
            text-align: center;
            position: relative;
        }

        .profile-wrapper {
            width: 130px;
            height: 130px;
            margin: 0 auto 25px auto;
            position: relative;
        }

        .profile {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #D4A373;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }

        h1 {
            color: #1a1a1a;
            font-size: 1.5rem;
            font-weight: 500;
            letter-spacing: 1px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        p {
            line-height: 1.8;
            color: #4a4a4a;
            font-weight: 300;
            margin-bottom: 15px;
        }

        /* กรอบเน้นความสนใจ สไตล์มินิมอลหรูหรา */
        .highlight-box {
            background: #F3EDE2;
            border: 1px solid #D4A373;
            border-radius: 8px;
            padding: 20px;
            margin: 25px 0;
        }

        .highlight-title {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8C6239;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .highlight-detail {
            font-size: 1.15rem;
            font-weight: 500;
            color: #1a1a1a;
        }

        /* ปุ่มกดสไตล์ Luxury Classic */
        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 28px;
            background: #1a1a1a;
            color: #FAF8F5;
            text-decoration: none;
            border-radius: 6px;
            font-size: 1.25rem;
            border: 1px solid #1a1a1a;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .btn:hover {
            background: #8C6239;
            border-color: #8C6239;
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(140, 98, 57, 0.3);
        }
    </style>
</head>

<body>

    <div class="card">
        <div class="profile-wrapper">
            <img src="Screenshot 2026-06-30 103336.png" alt="Profile" class="profile">
        </div>

        <h1>PORTFOLIO</h1>

        <p>
            Hello! my name is <strong style="font-weight: 600; color: #1a1a1a;">Siranata (<span class="en-font" style="font-size: 1.4rem;">Siranata</span>)</strong>
        </p>

        <div class="highlight-box">
            <div class="highlight-title">CURRENT INTEREST</div>
            <div class="highlight-detail">
                บริหารโลจิสติกส์ <br>
                <span class="en-font" style="font-size: 1.4rem; color: #8C6239;">Logistics Management</span>
            </div>
        </div>

        <a href="portfolio.html" class="btn">
            <span class="en-font">EXPLORE PORTFOLIO</span>
        </a>
    </div>

</body>
</html>
