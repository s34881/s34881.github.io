<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Siranata | Portfolio</title>

    <!-- Google Fonts: Great Vibes, Alex Brush & Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Great+Vibes&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        .en-title {
            font-family: 'Great Vibes', cursive !important;
        }

        .en-font {
            font-family: 'Alex Brush', cursive !important;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Prompt', sans-serif;
            
            /* พื้นหลัง GIF วิบวับ */
            background-image: url('8b1f2eb7b221c60e0caf5d1f31111518.gif');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #000000;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }

        /* คอนเทนเนอร์ไร้การ์ด ไร้พื้นหลังขาว ลอยกลางจอ */
        .content-container {
            max-width: 650px;
            width: 100%;
            text-align: center;
            padding: 20px;
            
            /* Animation ลอยขึ้นสมูท */
            animation: floatUp 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* รูปโปรไฟล์ลอย ไดคัทวงกลมมีออร่าสีทองชมพู */
        .profile-wrapper {
            width: 170px;
            height: 170px;
            margin: 0 auto 25px auto;
        }

        .profile {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #E8C197;
            box-shadow: 0 0 30px rgba(232, 193, 151, 0.5), 0 0 15px rgba(255, 255, 255, 0.8);
            transition: transform 0.5s ease;
        }

        .profile:hover {
            transform: scale(1.05);
        }

        /* หัวข้อ Portfolio สีทองใหญ่สะใจ */
        h1 {
            color: #F3E0B5;
            font-size: 5rem;
            font-weight: normal;
            line-height: 1;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(243, 224, 181, 0.6), 0 0 40px rgba(232, 193, 151, 0.3);
        }

        /* ตัวหนังสือแนะนำตัว ลอยสว่างอ่านง่าย */
        .intro-text {
            color: #ffffff;
            font-weight: 300;
            font-size: 1.4rem;
            line-height: 1.8;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .highlight-name {
            color: #F8B4C4;
            font-weight: 500;
        }

        .en-subname {
            font-size: 2.5rem;
            color: #F3E0B5;
            display: block;
            margin-top: 2px;
            text-shadow: 0 0 15px rgba(243, 224, 181, 0.4);
        }

        /* ส่วนคณะที่สนใจ */
        .interest-section {
            margin: 30px 0 45px 0;
        }

        .interest-title {
            font-size: 1.1rem;
            color: #E8C197;
            letter-spacing: 2px;
            margin-bottom: 8px;
            font-weight: 400;
            text-transform: uppercase;
            text-shadow: 0 2px 8px rgba(0,0,0,0.8);
        }

        .interest-detail {
            font-size: 1.8rem;
            font-weight: 500;
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
        }

        .en-faculty {
            font-size: 2.3rem;
            color: #F8B4C4;
            display: block;
            margin-top: 2px;
            text-shadow: 0 0 15px rgba(248, 180, 196, 0.4);
        }

        /* ปุ่มกดขนาดใหญ่ ลักชูคุมโทน */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 380px;
            padding: 16px 32px;
            background: linear-gradient(135deg, #B55B70, #7A3243);
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-size: 2.2rem;
            border: 2px solid #E8C197;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 0 25px rgba(181, 91, 112, 0.6), 0 10px 20px rgba(0,0,0,0.5);
        }

        .btn:hover {
            background: linear-gradient(135deg, #D46B82, #963D52);
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 0 35px rgba(248, 180, 196, 0.8), 0 15px 30px rgba(0,0,0,0.6);
            border-color: #ffffff;
        }
    </style>
</head>

<body>

    <div class="content-container">
        <div class="profile-wrapper">
            <img src="Screenshot 2026-06-30 103336.png" alt="Profile" class="profile">
        </div>

        <h1 class="en-title">Portfolio</h1>

        <div class="intro-text">
            สวัสดีค่ะ ดิฉัน <span class="highlight-name">ศิรณตา</span>
            <span class="en-font en-subname">Siranata Pholthekong</span>
        </div>

        <div class="interest-section">
            <div class="interest-title">คณะที่สนใจ</div>
            <div class="interest-detail">
                บริหารโลจิสติกส์
                <span class="en-font en-faculty">Logistics Management</span>
            </div>
        </div>

        <a href="portfolio.html" class="btn">
            <span class="en-title">View Portfolio</span>
        </a>
    </div>

</body>
</html>
